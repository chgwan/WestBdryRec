# Ablation arm 1 of the input-ablation study (ablation_inputs.md): the M3
# attention config with the two LH launcher-phase channels REMOVED.
#   full     : 18 channels (configs/dcs_model_attn.yml)  -- the existing
#              drop_f0.0_rope_time_s{0,1,2} runs are this arm's baseline
#   nopha    : 16 channels = full - {PhaLH1_scope, PhaLH2_scope}   (THIS FILE)
#   nopow    : 11 channels = nopha - {PowLH1/2, PowIC1/2/3}_scope
#              (configs/dcs_model_attn_nopha_nopow.yml; Ip + 10 PF only)
# Everything else identical to dcs_model_attn.yml; train with --pe rope_time.
run: dcs_attn

channels:        # 16 strict actuators -- NO Pha* (the ablation), no pe_*/dt cols
  - {node: PowLH1_scope, kind: lh,        nan: zero}
  - {node: PowLH2_scope, kind: lh,        nan: zero}
  - {node: PowIC1_scope, kind: ic,        nan: zero}
  - {node: PowIC2_scope, kind: ic,        nan: zero}
  - {node: PowIC3_scope, kind: ic,        nan: zero}
  - {node: Ip_scope,     kind: ip,        nan: drop}
  - {node: IBb_scope,    kind: pf,        nan: drop}
  - {node: IDb_scope,    kind: pf,        nan: drop}
  - {node: IEb_scope,    kind: pf,        nan: drop}
  - {node: IFb_scope,    kind: pf,        nan: drop}
  - {node: IFh_scope,    kind: pf,        nan: drop}
  - {node: IEh_scope,    kind: pf,        nan: drop}
  - {node: IDh_scope,    kind: pf,        nan: drop}
  - {node: IBh_scope,    kind: pf,        nan: drop}
  - {node: IXb_scope,    kind: pf,        nan: drop}
  - {node: IXh_scope,    kind: pf,        nan: drop}

derived: [pf_norm, lh_plus_ic, cum_heat, time_rel]
max_per_shot: 300        # snapshot-model knob; M3 uses windows and ignores it

hp:
  m0: {max_iter: 200, max_depth: 8, learning_rate: 0.1, l2_regularization: 1.0}
  m1: {hidden: 256, depth: 4, dropout: 0.1, lr: 0.001, epochs: 80, patience: 12}
  m2: {hidden: 64, layers: 2, dropout: 0.1, lr: 0.001, epochs: 80, patience: 12}
  m3:
    pe: rope_idx         # overridden by --pe; this is only the default
    d_model: 256
    heads: 8
    depth: 6
    ffn: 1024
    dropout: 0.1
    window: 2048         # 4.19 s on the 488 Hz axis
    ctx: 512             # attended, never scored -> stride 1536
    batch: 16
    lr: 0.0003           # a transformer will not take the GRU's flat 1e-3
    warmup: 5
    epochs: 80
    patience: 12
